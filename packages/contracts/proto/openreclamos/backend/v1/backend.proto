syntax = "proto3";
package openreclamos.backend.v1;
import "google/protobuf/struct.proto";
option go_package = "openreclamos.com/api/gen/openreclamos/backend/v1;backendv1";

// Envelope común; cada operación valida su DTO de dominio en el servidor.
message OperationRequest {
 string id = 1;
 google.protobuf.Struct data = 2;
 int32 page = 3;
 int32 page_size = 4;
 google.protobuf.Struct filters = 5;
}
message OperationResponse {
 google.protobuf.Struct data = 1;
 bytes document = 2;
 string file_name = 3;
 string content_type = 4;
 string access_token = 5;
 int64 access_expires_at = 6;
}
service BackendService {
 rpc Install(OperationRequest) returns (OperationResponse);
 rpc GetInstallationStatus(OperationRequest) returns (OperationResponse);
 rpc CompleteSetup(OperationRequest) returns (OperationResponse);
 rpc SuggestOrganizationSlug(OperationRequest) returns (OperationResponse);
 rpc SuggestStoreSlug(OperationRequest) returns (OperationResponse);
 rpc Register(OperationRequest) returns (OperationResponse);
 rpc Login(OperationRequest) returns (OperationResponse);
 rpc VerifyEmail(OperationRequest) returns (OperationResponse);
 rpc Logout(OperationRequest) returns (OperationResponse);
  rpc GetSession(OperationRequest) returns (OperationResponse);
  rpc RefreshToken(OperationRequest) returns (OperationResponse);
 rpc GetLoginOptions(OperationRequest) returns (OperationResponse);
 rpc UpdateProfile(OperationRequest) returns (OperationResponse);
 rpc ChangePassword(OperationRequest) returns (OperationResponse);
 rpc ListAPIKeys(OperationRequest) returns (OperationResponse);
 rpc CreateAPIKey(OperationRequest) returns (OperationResponse);
 rpc RevokeAPIKey(OperationRequest) returns (OperationResponse);
 rpc ListOrganizations(OperationRequest) returns (OperationResponse);
 rpc CreateOrganization(OperationRequest) returns (OperationResponse);
 rpc GetOrganization(OperationRequest) returns (OperationResponse);
 rpc UpdateOrganization(OperationRequest) returns (OperationResponse);
 rpc SwitchOrganization(OperationRequest) returns (OperationResponse);
 rpc GetSettings(OperationRequest) returns (OperationResponse);
 rpc UpdateSettings(OperationRequest) returns (OperationResponse);
 rpc RemoveLogo(OperationRequest) returns (OperationResponse);
 rpc ListStores(OperationRequest) returns (OperationResponse);
 rpc GetStore(OperationRequest) returns (OperationResponse);
 rpc CreateStore(OperationRequest) returns (OperationResponse);
 rpc UpdateStore(OperationRequest) returns (OperationResponse);
 rpc DeactivateStore(OperationRequest) returns (OperationResponse);
 rpc SetStoreFormEnabled(OperationRequest) returns (OperationResponse);
 rpc ListReasons(OperationRequest) returns (OperationResponse);
 rpc CreateReason(OperationRequest) returns (OperationResponse);
 rpc UpdateReason(OperationRequest) returns (OperationResponse);
 rpc DeleteReason(OperationRequest) returns (OperationResponse);
 rpc ListCategories(OperationRequest) returns (OperationResponse);
 rpc CreateCategory(OperationRequest) returns (OperationResponse);
 rpc UpdateCategory(OperationRequest) returns (OperationResponse);
 rpc DeleteCategory(OperationRequest) returns (OperationResponse);
 rpc ListUsers(OperationRequest) returns (OperationResponse);
 rpc GetUserAccess(OperationRequest) returns (OperationResponse);
 rpc UpdateUserAccess(OperationRequest) returns (OperationResponse);
 rpc RemoveUser(OperationRequest) returns (OperationResponse);
 rpc ListInvitations(OperationRequest) returns (OperationResponse);
 rpc CreateInvitation(OperationRequest) returns (OperationResponse);
 rpc RevokeInvitation(OperationRequest) returns (OperationResponse);
 rpc GetInvitation(OperationRequest) returns (OperationResponse);
 rpc AcceptInvitation(OperationRequest) returns (OperationResponse);
 rpc SendInvitationEmail(OperationRequest) returns (OperationResponse);
 rpc ListRoles(OperationRequest) returns (OperationResponse);
 rpc ListCountries(OperationRequest) returns (OperationResponse);
 rpc ListUbigeos(OperationRequest) returns (OperationResponse);
 rpc LookupDocument(OperationRequest) returns (OperationResponse);
 rpc GetPublicBook(OperationRequest) returns (OperationResponse);
 rpc SubmitComplaint(OperationRequest) returns (OperationResponse);
 rpc TrackComplaint(OperationRequest) returns (OperationResponse);
 rpc ListComplaints(OperationRequest) returns (OperationResponse);
 rpc GetComplaint(OperationRequest) returns (OperationResponse);
 rpc StartReview(OperationRequest) returns (OperationResponse);
 rpc SaveDraft(OperationRequest) returns (OperationResponse);
 rpc UpdateClassification(OperationRequest) returns (OperationResponse);
 rpc Respond(OperationRequest) returns (OperationResponse);
 rpc GetDashboard(OperationRequest) returns (OperationResponse);
 rpc ListFeatured(OperationRequest) returns (OperationResponse);
 rpc ListAudit(OperationRequest) returns (OperationResponse);
 rpc GetNotices(OperationRequest) returns (OperationResponse);
 rpc GetPrintableNotice(OperationRequest) returns (OperationResponse);
 rpc ExportBook(OperationRequest) returns (OperationResponse);
