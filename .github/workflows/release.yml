name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate release/tag consistency
        id: image
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "Tag: $TAG_NAME"
          echo "Prerelease: $IS_PRERELEASE"

          TAG_LOWER=$(echo "$TAG_NAME" | tr '[:upper:]' '[:lower:]')

          if [[ "$TAG_LOWER" =~ (alpha|beta|rc) ]] && [[ "$IS_PRERELEASE" != "true" ]]; then
            echo "::error::The tag '$TAG_NAME' looks like a pre-release tag (alpha/beta/rc), but the release is not marked as a pre-release."
            exit 1
          fi

          if [[ ! "$TAG_NAME" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::The release tag is not a valid Docker image tag."
            exit 1
          fi

          IMAGE="ghcr.io/${REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "$IMAGE:$TAG_NAME"
            if [[ "$IS_PRERELEASE" != "true" ]]; then
              echo "$IMAGE:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ !env.ACT }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Copy local workspace
        if: ${{ env.ACT }}
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: ${{ !env.ACT }}
        with:
          context: .
          file: ./Dockerfile
          push: ${{ !env.ACT }}
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          platforms: linux/amd64,linux/arm64
