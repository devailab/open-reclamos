services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-openreclamos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openreclamos}
      POSTGRES_DB: ${DB_NAME:-openreclamos}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql

  # Local SMTP catcher: capture outgoing emails without a real provider.
  # Web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pg-data:
